<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <rect width="1600" height="1100" fill="#f7f7f4"/>
  <rect x="20" y="20" width="1560" height="1060" fill="none" stroke="#222" stroke-width="3"/>
  <rect x="20" y="20" width="1560" height="56" fill="#24558c"/>
  <text x="40" y="55" fill="#fff" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold">
    WORM WHEEL (CROWN) — WW-150T-2.0-01 REV B
  </text>
  <text x="40" y="110" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#222">
    Corrected from mating worm entry data (da1=28.0,
    df1=19.33, Px=6.35, z1=1)
  </text>
  <rect x="40" y="130" width="520" height="200" fill="#ffebe6" stroke="#a33" stroke-width="2"/>
  <text x="55" y="155" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#8b1a1a">REVISION B — CALCULATION FIX</text>
  <text x="55" y="180" font-family="Helvetica, Arial, sans-serif" font-size="13">Rev A: a = (da1 + d)/2 = 165.58 mm  (used worm MAJOR diameter)</text>
  <text x="55" y="205" font-family="Helvetica, Arial, sans-serif" font-size="13">Rev B: a = (d1 + d)/2 = 163.57 mm  with d1 = da1 − 2m = 23.96 mm</text>
  <text x="55" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13">Δa = −2.01 mm · λ ≈ 4.8° (consistent with pitch diameter)</text>
  <text x="55" y="260" font-family="Helvetica, Arial, sans-serif" font-size="13">m = 2.021 · d = 303.19 · da = 307.23 · df = 298.34 · ha = 2.02 · hf = 2.43</text>
  <text x="55" y="285" font-family="Helvetica, Arial, sans-serif" font-size="13">s = 3.175 · i = 150:1 · L = 6.35 · q = 11.853</text>

  <!-- schematic -->
  <g transform="translate(900,420)">
    <circle cx="0" cy="0" r="138.2535" fill="none" stroke="#222" stroke-width="2"/>
    <circle cx="0" cy="0" r="136.4355" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="8 4"/>
    <circle cx="0" cy="0" r="134.253" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="27" fill="none" stroke="#222" stroke-width="1.5"/>
    <circle cx="147.213" cy="0" r="10.782" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="6 3"/>
    <circle cx="147.213" cy="0" r="12.6" fill="none" stroke="#222" stroke-width="1.2"/>
    <line x1="0" y1="160" x2="147.213" y2="160" stroke="#a11" stroke-width="1.5"/>
    <text x="73.6065" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#a11" font-weight="bold">a = 163.57 ± 0.05</text>
    <text x="0" y="-160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14">WHEEL</text>
    <text x="147.213" y="-40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14">WORM d1=23.96</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">
    <text x="40" y="380" font-weight="bold">WHEEL PARAMETERS</text>
    <text x="40" y="410">z2 = 150</text>
    <text x="40" y="435">m = 2.021 mm</text>
    <text x="40" y="460">d = 303.19 mm</text>
    <text x="40" y="485">da = 307.23 mm</text>
    <text x="40" y="510">df = 298.34 mm</text>
    <text x="40" y="535">ha / hf / h = 2.02 / 2.43 / 4.45 mm</text>
    <text x="40" y="560">s = 3.175 mm</text>
    <text x="40" y="585" font-weight="bold" fill="#8b1a1a">a = 163.57 mm  (was 165.58)</text>
    <text x="40" y="610">λ ≈ 4.8°</text>
    <text x="40" y="650">Face width 35 +0.20/0 · Bore Ø60 H7 · Hub Ø120 · Material CuSn12</text>
  </g>

  <text x="40" y="1040" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555">
    Formulas: m=Px/π · d1=da1−2m · d=m·z2 · a=(d1+d)/2 · λ=arctan(L/(π·d1)) · ha=m · hf=1.2m
  </text>
</svg>
