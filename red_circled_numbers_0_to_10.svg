<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  width="1120"
  height="120"
  viewBox="0 0 1120 120"
  version="1.1"
  inkscape:version="1.3">
  <title>Red circled numbers 0 to 10</title>
  <desc>Vector-style red numbers from 0 to 10, each centered inside a red circular frame.</desc>
  <style>
    .number-circle {
      fill: none;
      stroke: #ff0000;
      stroke-width: 6;
    }

    .number-text {
      fill: #ff0000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 52px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <g id="number-0">
    <circle class="number-circle" cx="60" cy="60" r="42" />
    <text class="number-text" x="60" y="62">0</text>
  </g>
  <g id="number-1">
    <circle class="number-circle" cx="160" cy="60" r="42" />
    <text class="number-text" x="160" y="62">1</text>
  </g>
  <g id="number-2">
    <circle class="number-circle" cx="260" cy="60" r="42" />
    <text class="number-text" x="260" y="62">2</text>
  </g>
  <g id="number-3">
    <circle class="number-circle" cx="360" cy="60" r="42" />
    <text class="number-text" x="360" y="62">3</text>
  </g>
  <g id="number-4">
    <circle class="number-circle" cx="460" cy="60" r="42" />
    <text class="number-text" x="460" y="62">4</text>
  </g>
  <g id="number-5">
    <circle class="number-circle" cx="560" cy="60" r="42" />
    <text class="number-text" x="560" y="62">5</text>
  </g>
  <g id="number-6">
    <circle class="number-circle" cx="660" cy="60" r="42" />
    <text class="number-text" x="660" y="62">6</text>
  </g>
  <g id="number-7">
    <circle class="number-circle" cx="760" cy="60" r="42" />
    <text class="number-text" x="760" y="62">7</text>
  </g>
  <g id="number-8">
    <circle class="number-circle" cx="860" cy="60" r="42" />
    <text class="number-text" x="860" y="62">8</text>
  </g>
  <g id="number-9">
    <circle class="number-circle" cx="960" cy="60" r="42" />
    <text class="number-text" x="960" y="62">9</text>
  </g>
  <g id="number-10">
    <circle class="number-circle" cx="1060" cy="60" r="42" />
    <text class="number-text" x="1060" y="62">10</text>
  </g>
</svg>
